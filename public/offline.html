<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — K.K. Danny Enterprise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, 'Segoe UI', system-ui, sans-serif; background: #15212c; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .card { max-width: 400px; }
    img { width: 80px; height: auto; margin-bottom: 1.5rem; border-radius: 8px; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    p { color: #8a9ba8; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem; }
    button { background: #C8960C; color: #000; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; border: none; padding: 12px 32px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #E8B020; }
    .phone { color: #C8960C; font-weight: 600; font-size: 1rem; margin-top: 1rem; }
    .phone a { color: #C8960C; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="K.K. Danny Enterprise" onerror="this.style.display='none'">
    <h1>You're Offline</h1>
    <p>No internet connection. Check your network and try again. You can still call us directly.</p>
    <button onclick="window.location.reload()">Try Again</button>
    <div class="phone"><a href="tel:+233244754803">0244 754 803</a></div>
  </div>
</body>
</html>
